name: Release

# 只在推送版本 tag 时发布：main push / PR 不打包；手动 workflow_dispatch 用于干跑
# （构建 job 全跑，但不发布 Release），新改打包链路时先用干跑验证再打 tag。
# 普通提交的检查由 verify.yml 负责（analyze、test、linux build）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: hax-shot-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'
  NOTARY_PROFILE: hax-shot-notary

jobs:
  preflight:
    name: Verify tag matches pubspec
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches pubspec version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            echo "Dry run on '${GITHUB_REF_NAME}': skipping tag/version check."
            exit 0
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          pubspec_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          app_version="${pubspec_version%%+*}"
          if [[ -z "${pubspec_version}" || "${tag_version}" != "${app_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} must match pubspec version ${app_version}." >&2
            echo "The build metadata (+N) becomes the Fedora RPM release number." >&2
            exit 1
          fi
          echo "Releasing Hax Shot ${tag_version} (pubspec ${pubspec_version})."

  linux:
    name: Linux (.deb + .rpm)
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            patchelf \
            rpm \
            libgtk-3-dev \
            libkeybinder-3.0-dev \
            libayatana-appindicator3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Build Linux release bundle
        run: flutter build linux --release

      - name: Package DEB
        run: ./scripts/build_linux_deb.sh --skip-build

      - name: Package RPM
        run: ./scripts/build_linux_rpm.sh --skip-build

      - name: Verify packages
        shell: bash
        run: |
          set -euo pipefail
          deb=(build/linux/x64/release/hax-shot_*.deb)
          rpm=(build/linux/x64/release/hax-shot-*.rpm)
          test -f "${deb[0]}"
          test -f "${rpm[0]}"
          # 两个包都必须带上 Rust 原生库，缺了就是 bundle 没打全。
          # 先把文件列表写到文件再 grep：`dpkg-deb -c | grep -q` 会在命中时提前
          # 关掉管道，dpkg-deb 收到 EPIPE 后在 pipefail 下会把整个 step 判失败。
          dpkg-deb -c "${deb[0]}" > deb-list.txt
          rpm -qlp "${rpm[0]}" > rpm-list.txt
          grep -q 'opt/hax-shot/lib/libhax_shot_native.so' deb-list.txt
          grep -q '/opt/hax-shot/lib/libhax_shot_native.so' rpm-list.txt
          printf 'DEB: %s\nRPM: %s\n' "${deb[0]}" "${rpm[0]}"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: hax-shot-linux-${{ github.ref_name }}
          path: |
            build/linux/x64/release/hax-shot_*.deb
            build/linux/x64/release/hax-shot-*.rpm
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS (.dmg)
    needs: preflight
    # 项目只支持 Apple Silicon（macos/Runner/Configs/AppInfo.xcconfig 里 ARCHS = arm64），
    # 所以固定用 arm64 的 runner 镜像。
    runs-on: macos-14
    timeout-minutes: 30
    outputs:
      notarized: ${{ steps.signing.outputs.notarize }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          if [[ "${arch}" != "arm64" ]]; then
            echo "This runner is ${arch}; Hax Shot only ships arm64 macOS builds." >&2
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Resolve Dart dependencies
        run: flutter pub get

      # 签名策略（见 docs/ci-release.md 第 5 节）：
      #   没有证书      → ad-hoc DMG，文件名带 -unsigned，Release 正文加警告（只算内部测试包）
      #   有证书没凭据  → 直接失败（半配置状态不允许静默发出去）
      #   证书 + 凭据    → 必须签 + 公证，任何一步失败都会让 job 挂掉
      - name: Configure macOS signing
        id: signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERTIFICATE_P12:-}" ]]; then
            echo "::warning::未配置 Developer ID 证书：本次只能产出 ad-hoc 签名的内部测试 DMG（文件名带 -unsigned，会被 Gatekeeper 拒绕）"
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "${APPLE_ID:-}" || -z "${APPLE_APP_PASSWORD:-}" || -z "${APPLE_TEAM_ID:-}" ]]; then
            echo "::error::已配置 MACOS_CERTIFICATE_P12，但公证凭据不全（APPLE_ID / APPLE_APP_PASSWORD / APPLE_TEAM_ID）：要么补齐，要么清掉证书 secret。半配置状态不允许发布未公证的 DMG。"
            exit 1
          fi

          keychain="$RUNNER_TEMP/hax-shot-signing.keychain-db"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          echo "${MACOS_CERTIFICATE_P12}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # 不给 keychain 里的私钥授权，codesign 会静默取不到身份。
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          # 走到这里说明证书和公证凭据都齐了：凭据不全的情况上面已经失败退出。
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          echo "notarize=true" >> "$GITHUB_OUTPUT"

      - name: Build, sign and package DMG
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.signing.outputs.notarize }}" == "true" ]]; then
            ./scripts/build_macos_dmg.sh --notarize
          else
            ./scripts/build_macos_dmg.sh
            # 名字里必须写清楚：这种包只是内部测试用，不能让人以为下载就能装。
            for dmg in build/macos/HaxShot-*-arm64.dmg; do
              mv "$dmg" "${dmg%-arm64.dmg}-arm64-unsigned.dmg"
            done
          fi

      - name: Verify DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg=(build/macos/HaxShot-*.dmg)
          test -f "${dmg[0]}"
          app="build/macos/Build/Products/Release/hax_shot.app"
          test "$(lipo -archs "$app/Contents/MacOS/hax_shot")" = "arm64"
          test "$(lipo -archs "$app/Contents/Frameworks/libhax_shot_native.dylib")" = "arm64"
          # 没公证的包必须带 -unsigned 后缀，否则就是命名漏了标记。
          if [[ "${{ steps.signing.outputs.notarize }}" != "true" ]]; then
            case "${dmg[0]}" in
              *-unsigned.dmg) ;;
              *) echo "unsigned DMG must carry the -unsigned suffix: ${dmg[0]}" >&2; exit 1 ;;
            esac
          fi
          printf 'DMG: %s\n' "${dmg[0]}"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: hax-shot-macos-${{ github.ref_name }}
          path: build/macos/HaxShot-*.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    # 只在真正的 tag push 时发布；workflow_dispatch 干跑只验证构建产物。
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [preflight, linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No assets were downloaded from the build jobs." >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "Hax Shot ${TAG}" \
              --generate-notes \
              --verify-tag
          fi

      # 没公证的 DMG 虽然带着 -unsigned 后缀，但光看文件名不够：在 Release 正文顶部
      # 写清楚它不能当常规安装包分发。重复跑不会叠加（先查是否已有那段提示）。
      - name: Mark unsigned macOS build in release notes
        if: needs.macos.outputs.notarized != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          marker="**macOS 包未签名/未公证**"
          body="$(gh release view "$TAG" --json body -q .body)"
          if grep -qF "$marker" <<<"$body"; then
            echo "Release notes already carry the unsigned warning."
            exit 0
          fi
          {
            printf '> %s：`HaxShot-*-unsigned.dmg` 是 ad-hoc 签名的内部测试包，在别人的 Mac 上会被 Gatekeeper 拒绕。\n' "$marker"
            printf '> 正式分发需要 Developer ID 证书 + 公证（见 docs/ci-release.md 第 5 节）。\n\n'
            printf '%s\n' "$body"
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
