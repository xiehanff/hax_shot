name: Verify

on:
  push:
    branches:
      - main
    # 发布提交只改 pubspec.yaml 的版本号。那种提交紧接着就会打 v* tag，由 release.yml
    # 完整跑一遍构建/打包；这里跳过，免得同一个 commit 被 Verify 和 Release 各跑一遍
    # （paths-ignore 只在本次 push 的全部改动都命中时才跳过，带代码的提交仍会跑）。
    paths-ignore:
      - 'pubspec.yaml'
      # 纯文档改动不可能让编译/测试挂掉，不值得占一次 macOS runner。
      # 注意 paths-ignore 只在本次 push/PR 的**全部**改动都命中时才跳过：
      # 同时改了代码和文档仍然会跑（这是期望行为）。
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: hax-shot-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  verify:
    name: Linux analyze, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libkeybinder-3.0-dev \
            libayatana-appindicator3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Run Dart checks
        run: |
          flutter analyze
          flutter test
          flutter test packages/plume_ai_chat/test

      - name: Run Rust checks
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --check
          cargo check --manifest-path rust/Cargo.toml
          cargo test --manifest-path rust/Cargo.toml

      - name: Build Linux release bundle
        run: flutter build linux --release

      - name: Verify native library bundle
        run: |
          test -x build/linux/x64/release/bundle/hax_shot
          test -f build/linux/x64/release/bundle/lib/libhax_shot_native.so

  # macOS 侧的 PR 级门禁：保证「macOS 编得过 + macOS 专属的 Dart 测试通过」。
  # `flutter test` 不能省：hotkey_binding / screen_capture_permission 里有只在 macOS 上
  # 跑的用例（Carbon 键码、TCC），Linux job 覆盖不到。
  # RunnerTests（XCTest）不在这里跑：它上一次要花 2m13s，大头是给 app-hosted 测试编一份
  # Debug app，收益不值这个时长。要验证窗口 styleMask / 圆角，按
  # docs/development-guide.md 「窗口圆角」里的命令本地手动跑。
  macos:
    name: macOS tests and build
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
          targets: aarch64-apple-darwin

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Run Dart tests
        run: flutter test

      - name: Run Rust checks
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --check
          cargo check --manifest-path rust/Cargo.toml
          cargo test --manifest-path rust/Cargo.toml

      # RunnerTests 是 macOS 侧唯一的行为门禁（窗口 styleMask / 圆角 / traffic light），
      # 本地手动跑的命令和两个硬约束（先 --config-only、必须 Debug 配置、先 pkill -x
      # HaxShot）记在 docs/development-guide.md 的「窗口圆角」一节。
      - name: Build macOS release bundle
        run: flutter build macos --release

  # Windows 侧的 PR 级门禁：Windows 编得过 + bundle 是完整的。
  #
  # 不跑 `flutter test` / `cargo test`（仓库规则：默认不跑测试；计划 §4.1）；保留
  # `flutter analyze`：Dart 是三个 job 共享的代码，这里不跑就会出现“Linux 绿、
  # Windows 编不过”的空档。按计划 §49，Windows 适配期**先跑通、不先做减负**，真要
  # 省 analyze 的成本等 Windows 长期稳定后再说。
  windows:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Resolve Dart dependencies
        run: flutter pub get

      # pwsh 只检查**整个 step 最后一条命令**的退出码，中间命令失败会被吞掉，所以每步都要
      # 显式 throw。构建本身由 CMake 调 cargo（windows/CMakeLists.txt），不额外加 cargo 缓存：
      # 现有 Linux/macOS job 也没有，先保持一致。
      - name: Run Dart checks
        shell: pwsh
        run: |
          flutter analyze
          if ($LASTEXITCODE -ne 0) { throw 'flutter analyze failed' }

      - name: Run Rust checks
        shell: pwsh
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt failed' }
          cargo check --manifest-path rust/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo check failed' }

      - name: Build Windows release bundle
        shell: pwsh
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw 'windows build failed' }

      # `Test-Path` 打印 False 不会让 job 失败，缺文件必须 throw。这里只查 bundle 本身；
      # app-local CRT 与 ZIP 完整性（打包脚本、release.yml）属于发布流程，见 docs/packaging.md。
      - name: Verify bundle completeness
        shell: pwsh
        run: |
          $bundle = 'build/windows/x64/runner/Release'
          $required = @(
            'hax_shot.exe',
            'hax_shot_native.dll',
            'flutter_windows.dll',
            'data/app.so',
            'data/icudtl.dat',
            'data/flutter_assets'
          )
          foreach ($item in $required) {
            if (-not (Test-Path (Join-Path $bundle $item))) { throw "Missing bundle entry: $item" }
          }
          # 插件 DLL 不能只手写几个名字：少一个也照样“构建成功”。
          $pluginDlls = Get-ChildItem $bundle -Filter *.dll |
            Where-Object { $_.Name -notin @('hax_shot_native.dll', 'flutter_windows.dll') }
          if ($pluginDlls.Count -lt 5) {
            throw "Plugin DLLs look incomplete: found $($pluginDlls.Count)"
          }
          $pluginDlls | Select-Object -ExpandProperty Name | Sort-Object
          if (-not (Get-ChildItem (Join-Path $bundle 'data/flutter_assets') -ErrorAction SilentlyContinue)) {
            throw 'data/flutter_assets is empty'
          }
          Write-Host "Bundle OK: $bundle"
