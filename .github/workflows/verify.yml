name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: hax-shot-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  verify:
    name: Linux analyze, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libkeybinder-3.0-dev \
            libayatana-appindicator3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Run Dart checks
        run: |
          flutter analyze
          flutter test
          flutter test packages/plume_ai_chat/test

      - name: Run Rust checks
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --check
          cargo check --manifest-path rust/Cargo.toml
          cargo test --manifest-path rust/Cargo.toml

      - name: Build Linux release bundle
        run: flutter build linux --release

      - name: Verify native library bundle
        run: |
          test -x build/linux/x64/release/bundle/hax_shot
          test -f build/linux/x64/release/bundle/lib/libhax_shot_native.so

  # macOS 已经是正式平台（有 RunnerTests 守着窗口/TCC 相关行为），但 Release workflow
  # 只构建、不跑测试，所以这里补一个 PR 级门禁：Swift/ObjC 改坏了、macOS 编不过，要在
  # 合入前发现，而不是等打 tag 的时候才发现。
  macos:
    name: macOS tests and build
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
          targets: aarch64-apple-darwin

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Run Dart tests
        run: flutter test

      - name: Run Rust checks
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --check
          cargo check --manifest-path rust/Cargo.toml
          cargo test --manifest-path rust/Cargo.toml

      # RunnerTests 是 macOS 侧唯一的行为门禁（窗口 styleMask / 圆角 / traffic light），
      # 之前只存在于本地。CODE_SIGNING_ALLOWED=NO：CI 没有证书，测试也不需要签名。
      - name: Run RunnerTests (XCTest)
        run: |
          xcodebuild test \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build macOS release bundle
        run: flutter build macos --release
