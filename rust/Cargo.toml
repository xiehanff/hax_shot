[package]
name = "hax_shot_native"
version = "0.1.0"
edition = "2021"
description = "Native capture and clipboard backend for Hax Shot."
license = "MIT"
rust-version = "1.87"

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "0.3"
gstreamer = "0.25.3"
tokio = { version = "1", features = ["rt", "macros", "time"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = "0.24"
foreign-types = "0.5"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
] }

[dependencies]
png = "0.18.1"
